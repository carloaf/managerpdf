[server]
headless = true
port = 8501
address = "0.0.0.0"
maxUploadSize = 200
enableXsrfProtection = true
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#e11d48"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f8fafc"
textColor = "#0f172a"
font = "sans serif"

[client]
showErrorDetails = "full"
toolbarMode = "minimal"
